<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <title>Best Words - 111</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: #1a1a2e;
      color: white;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 40px;
      color: #4a9eda;
    }
    
    .board-section {
      margin-bottom: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
    }
    
    .board-title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #4a9eda;
    }
    
    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    .column {
      text-align: center;
    }
    
    .column-header {
      font-size: 14px;
      font-weight: bold;
      color: #aaa;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .word-display {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    
    .score-display {
      font-size: 18px;
      color: #4a9eda;
    }
    
    .player-word {
      color: white;
    }
    
    .best-word {
      color: #4CAF50;
    }
    
    .back-button {
      display: block;
      width: 200px;
      margin: 40px auto 0;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      background: #4a9eda;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    
    .back-button:active {
      transform: scale(0.95);
    }
    
    .empty-message {
      text-align: center;
      font-size: 18px;
      color: #aaa;
      margin: 40px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Best Words</h1>
    <div id="results-container"></div>
    <a href="game.html" class="back-button">Back to Game</a>
  </div>

  <script>
    // Load board results from sessionStorage
    const boardResults = JSON.parse(sessionStorage.getItem('boardResults') || '[]');
    
    const container = document.getElementById('results-container');
    
    if (boardResults.length === 0) {
      container.innerHTML = '<div class="empty-message">No game data available. Play a game first!</div>';
    } else {
      boardResults.forEach((board, index) => {
        const section = document.createElement('div');
        section.className = 'board-section';
        
        section.innerHTML = `
          <div class="board-title">Board ${index + 1}</div>
          <div class="comparison">
            <div class="column">
              <div class="column-header">Player's Best</div>
              <div class="word-display player-word">${board.playerWord || '—'}</div>
              <div class="score-display">${board.playerScore || 0} points</div>
            </div>
            <div class="column">
              <div class="column-header">Best Possible</div>
              <div class="word-display best-word">${board.bestWord || 'TBD'}</div>
              <div class="score-display">${board.bestScore || '?'} points</div>
            </div>
          </div>
        `;
        
        container.appendChild(section);
      });
    }
  </script>
</body>
</html>

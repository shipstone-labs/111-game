<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>111</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      padding: 20px;
    }
    
    .logo {
      font-size: 120px;
      font-weight: bold;
      color: #4a9eda;
      margin-bottom: 60px;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    
    .tagline {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 80px;
      text-align: center;
      max-width: 300px;
    }
    
    .play-button {
      padding: 20px 60px;
      font-size: 32px;
      font-weight: bold;
      background: #4a9eda;
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(74, 158, 218, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .play-button:active {
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(74, 158, 218, 0.3);
    }
  </style>
</head>
<body>
  <div class="logo">111</div>
  <div class="tagline">Score exactly 111 points in this addictive word puzzle game</div>
  <button class="play-button" onclick="window.location.href='game.html'">Play</button>
</body>
</html>

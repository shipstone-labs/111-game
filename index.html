<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>111</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background:white; text-align:center; padding:20px; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0;">

  <div style="margin-bottom: -60px;"> 
    <img src="icon-1024.png" style="width:280px; max-width:85vw; height:auto; display:block; margin:0 auto;">
  </div>

  <p style="font-size:18px; line-height:1.4; color:black; max-width:320px; margin:0 0 30px 0; font-weight:500;">
    The task is to score exactly 111 points as many times as possible in 60 seconds. Words can only be used once. Players get 30 more seconds each time three 111s are completed.
  </p>

  <button onclick="window.location.href='game.html'" style="background:#008E97; color:white; padding:16px 80px; font-size:32px; border:none; border-radius:100px; font-weight:bold; box-shadow: 0 6px 20px rgba(0, 142, 151, 0.3); cursor:pointer; -webkit-tap-highlight-color:transparent;">
    Start
  </button>

  <script src="game.js"></script>
</body>
</html>

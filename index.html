<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>111</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-1024.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Lexend', sans-serif;
      height: 100vh;
      height: 100dvh;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* This padding moves the logo down from the very top edge */
      padding: 15vh 20px 10vh 20px; 
    }
    
    .logo {
      width: 280px;
      max-width: 75vw;
      height: auto;
      /* This ensures the logo stays in the upper section */
      margin-bottom: 40px; 
    }
    
    .tagline {
      font-size: 19px;
      line-height: 1.5;
      color: #000;
      text-align: center;
      max-width: 340px;
      font-weight: 500;
      /* This pushes the button further down away from the text */
      margin-bottom: auto; 
    }
    
    .start-button {
      padding: 16px 80px;
      font-size: 32px;
      font-weight: 700;
      background: #008E97;
      color: #fff;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 142, 151, 0.2);
      /* Keeps the button toward the bottom */
      margin-top: 20px; 
    }

    .start-button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

    <img src="icon-1024.png" alt="111" class="logo">
    
    <div class="tagline">
      The task is to score exactly 111 points as many times as possible in 60 seconds. Words can only be used once. Players get 30 more seconds each time three 111s are completed.
    </div>
    
    <button class="start-button" onclick="window.location.href='game.html'">Start</button>

</body>
</html>

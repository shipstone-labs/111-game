<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>111</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 20px;
    }
    
    .logo-image {
      width: 280px;
      height: 280px;
      margin-bottom: 60px;
    }
    
    .tagline {
      font-size: 18px;
      color: black;
      margin-bottom: 80px;
      text-align: center;
      max-width: 320px;
    }
    
    .play-button {
      padding: 20px 60px;
      font-size: 32px;
      font-weight: bold;
      background: #008E97;
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 142, 151, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .play-button:active {
      transform: scale(0.95);
      box-shadow: 0 4px 15px rgba(74, 158, 218, 0.3);
    }
  </style>
</head>
<body>
  <img src="icon-512.png" alt="111" class="logo-image">
  <div class="tagline">The task is to score exactly 111 points as many times as possible in 60 seconds. Players get 30 more seconds each time three 111s are completed.</div>
  <button class="play-button" onclick="window.location.href='game.html'">Start</button>
</body>
</html>

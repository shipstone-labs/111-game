<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <title>111</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-1024.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lexend', sans-serif;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      flex-grow: 1;
      justify-content: center;
    }
    .logo {
      width: 280px;
      max-width: 80vw;
      height: auto;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .tagline {
      font-size: 18px;
      line-height: 1.6;
      color: #333;
      text-align: center;
      max-width: 320px;
    }
    .start-button {
      padding: 18px 80px;
      font-size: 28px;
      font-weight: 900;
      background: #008E97;
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 142, 151, 0.3);
    }
    .start-button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="content">
    <img src="icon-1024.png" alt="111" class="logo">
    <div class="tagline">
      Score exactly <strong>111</strong> points as many times as possible. 
      <br><br>
      Gain 30 seconds for every three 111s completed.
    </div>
    <button class="start-button" onclick="window.location.href='game.html'">START</button>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4a9eda">
  <title>Ruzzle</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234a9eda' width='100' height='100' rx='20'/><text x='50' y='68' text-anchor='middle' font-size='50' font-weight='bold' fill='white'>R</text></svg>">
</head>
<body>
  <div class="game-container" id="gameContainer">
    <div class="header">
      <div class="timer">
        <svg class="timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="13" r="8"/>
          <path d="M12 9v4l2 2"/>
          <path d="M9 2h6"/>
          <path d="M12 2v2"/>
        </svg>
        <span class="timer-display" id="timerDisplay">1:00</span>
      </div>
      <div class="score" id="scoreValue">0</div>
      <button class="start-btn" id="startBtn">Play</button>
    </div>
    <div class="word-area">
      <div class="word-pill" id="wordPill">
        <span class="word-text" id="wordText"></span>
        <span class="word-score" id="wordScore"></span>
      </div>
    </div>
    <div style="position: relative;">
      <canvas id="board"></canvas>
      <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-text">Game Over</div>
        <div class="final-score" id="finalScore">0</div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>

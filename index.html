<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>111</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:white; text-align:center; padding:20px; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0;">

  <div style="width: 100%; max-width: 300px; margin-bottom: 20px;"> 
    <img src="icon-1024.png" style="width:100%; height:auto; display:block; margin:0 auto;">
  </div>

  <p style="font-size:18px; line-height:1.4; color:black; max-width:320px; margin:0 0 30px 0; font-weight:500;">
    The task is to score exactly 111 points as many times as possible in 60 seconds. Words can only be used once. Players get 30 more seconds each time three 111s are completed.
  </p>

  <button onclick="window.location.href='game.html'" style="background:#008E97; color:white; padding:16px 60px; font-size:28px; border:none; border-radius:100px; font-weight:bold; box-shadow: 0 4px 12px rgba(0, 142, 151, 0.3); cursor:pointer;">
    Start
  </button>

</body>
</html>

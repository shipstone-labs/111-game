<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>111</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/111-game/sw.js');
    }
  </script>
</head>
<body style="margin:0; padding:0; text-align:center; background:white;">
  <div style="padding-top:40px;">
    <img src="apple-touch-icon.png" style="width:180px; height:180px; border-radius:40px;">
  </div>
  <div style="padding: 0 25px;">
    <p style="font-size:18px; line-height:1.4; color:black; max-width:320px; margin:40px auto; font-weight:500;">
      The task is to score exactly 111 points as many times as possible in 60 seconds. Words can only be used once. Players get 30 more seconds each time three 111s are completed.
    </p>
  </div>
  <button onclick="window.location.href='game.html'" style="background:#008E97; color:white; padding:18px 80px; font-size:32px; border:none; border-radius:100px; font-weight:bold; cursor:pointer;">
    Start
  </button>
</body>
</html>

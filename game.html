<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>111</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="icon-512.png">
  <style>
    /* Results button styling */
    #resultsBtn {
      margin-top: 16px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      background: #008E97;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      max-width: 300px;
      display: none;
      box-shadow: 0 4px 12px rgba(0, 142, 151, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    #resultsBtn.visible {
      display: block;
    }
    
    #resultsBtn:active {
      transform: scale(0.95);
    }
    
    /* Make button container stack buttons vertically */
    .button-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="boards">
        <span class="boards-icon">✓</span>
        <span class="boards-value" id="boardsValue">0</span>
      </div>
      <div class="score">
        <span class="score-value" id="scoreValue">0</span>
        <span class="score-sep">/</span>
        <span class="score-target">111</span>
      </div>
      <div class="timer" id="timer">60</div>
    </div>
    <div class="word-area">
      <div class="word-pill" id="wordPill">
        <span class="word-text" id="wordText"></span>
      </div>
    </div>
    <canvas id="board"></canvas>
    <div class="button-container">
      <button class="start-btn" id="startBtn">Play</button>
      <button id="resultsBtn" onclick="window.location.href='results.html'">
        See Best Results From This Game
      </button>
    </div>
  </div>
  <script src="game.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/111-game/sw.js')
        .then(reg => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker registration failed:', err));
    }
    
    // Show/hide results button based on game state
    const resultsBtn = document.getElementById('resultsBtn');
    const startBtn = document.getElementById('startBtn');
    
    // Show results button when game ends
    const originalStartBtnClick = startBtn.onclick;
    startBtn.addEventListener('click', function() {
      // Hide results button when starting new game
      if (startBtn.textContent === 'Play' || startBtn.textContent === 'New Game') {
        resultsBtn.classList.remove('visible');
      }
    });
    
    // Watch for game timeout to show results button
    setInterval(() => {
      if (startBtn.textContent === 'New Game') {
        resultsBtn.classList.add('visible');
      }
    }, 500);
  </script>
</body>
</html>
